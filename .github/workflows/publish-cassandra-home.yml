name: Publish Apache Cassandra homepage status

on:
  push:
    paths:
      - ".github/workflows/publish-cassandra-home.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update homepage status
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  "Twelve courses currently available",
                  "Thirteen courses currently available",
              ),
              (
                  '<strong>12</strong><span>available curricula</span>',
                  '<strong>13</strong><span>available curricula</span>',
              ),
              (
                  "Core, NoSQL and Distributed Database Fundamentals, MongoDB, and\n              Redis are fully available.",
                  "Core, NoSQL and Distributed Database Fundamentals, MongoDB, Redis,\n              and Apache Cassandra are fully available.",
              ),
              (
                  "Fundamentals, MongoDB, and Redis are active today. Courses 13–44\n            expose their planned curricula",
                  "Fundamentals, MongoDB, Redis, and Apache Cassandra are active today.\n            Courses 14–44 expose their planned curricula",
              ),
              (
                  'class="stage-course-link"\n                  href="courses/apache-cassandra/index.html"',
                  'class="stage-course-link is-available"\n                  href="courses/apache-cassandra/index.html"',
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"Expected homepage text not found: {old!r}")
              text = text.replace(old, new, 1)

          cassandra_href = 'href="courses/apache-cassandra/index.html"'
          neo4j_href = 'href="courses/neo4j/index.html"'
          card_start = text.index('class="course-card"\n              ' + cassandra_href)
          card_end = text.index(neo4j_href, card_start)
          card = text[card_start:card_end]

          card_replacements = [
              ('class="course-card"', 'class="course-card available"'),
              ('data-status="planned"', 'data-status="available"'),
              ('<span class="status-pill"><i></i>Planned</span>', '<span class="status-pill available"><i></i>Available</span>'),
              ('<span>View planned curriculum</span>', '<span>Open curriculum</span>'),
          ]

          for old, new in card_replacements:
              if old not in card:
                  raise SystemExit(f"Expected Cassandra card text not found: {old!r}")
              card = card.replace(old, new, 1)

          text = text[:card_start] + card + text[card_end:]

          if text.count('data-status="available"') != 13:
              raise SystemExit("Expected exactly 13 available course cards after update")
          if 'class="stage-course-link is-available"\n                  href="courses/apache-cassandra/index.html"' not in text:
              raise SystemExit("Cassandra roadmap link is not marked available")
          if '<h4>Apache Cassandra</h4>' not in text or '<strong>13</strong><span>available curricula</span>' not in text:
              raise SystemExit("Cassandra/count validation failed")

          path.write_text(text, encoding="utf-8")

      - name: Commit homepage update and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/publish-cassandra-home.yml
          git add index.html
          git commit -m "publish: make Apache Cassandra available on homepage"
          git push origin main
